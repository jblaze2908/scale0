; deploy/app.conf in an app's repo, for `scale0 deploy add <app> <repo-dir>`.
[app]
compose = deploy/compose.yml
project = myapp
env_file = /etc/myapp/myapp.env
key =                                  ; read-only deploy key, empty for a public https remote
health = http://127.0.0.1:18080/healthz
backup = pg_dump:db                    ; or command:<shell>, or leave out
notify = NTFY_URL NTFY_TOKEN           ; env-file keys for the ntfy URL and token, then an optional topic

[service.db]
mode = always

[service.app]
mode = sleep
scale0 = myapp                         ; the name given to `scale0 enable`
