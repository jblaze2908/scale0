# /etc/scale0/scale0.conf: this host's scale0 settings, read by scale0-status.service and scale0-self.service.
# Status page bind. 127.0.0.1 for an SSH tunnel or a host-network proxy; the Docker bridge address (often
# 172.17.0.1) when the reverse proxy runs in a container.
SCALE0_STATUS_BIND=127.0.0.1
SCALE0_STATUS_PORT=8359
# Read-only deploy key for self-update from a private remote. Leave unset for a public https remote.
# SCALE0_DEPLOY_KEY=/path/to/read-only-deploy-key
